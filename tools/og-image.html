<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image builder</title>
<!--
  Builds site/og.png, the 1200×630 link-preview card.
  Run from the repo root: python -m http.server 8765, then screenshot
  http://localhost:8765/tools/og-image.html?v=a at 1200×630, for example:
  chrome --headless=new --window-size=1200,630 --screenshot=site/og.png "http://localhost:8765/tools/og-image.html?v=a"
  ?v=a has the ASCII portrait (in use); ?v=b is type only.
-->

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0d0e0f; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #0d0e0f; color: #e8e9eb; font-family: 'DM Sans', sans-serif; }
  .mark { position: absolute; left: 80px; top: 72px; font: 400 22px/1 'JetBrains Mono', monospace; color: #a0a5ad; }
  .mark b { color: #d69e2e; font-weight: 400; }
  h1 { position: absolute; left: 76px; margin: 0; font-weight: 500; letter-spacing: -0.045em; line-height: .92; }
  h1 span { color: #d69e2e; }
  .role { position: absolute; left: 80px; font: 400 30px/1.3 'DM Sans', sans-serif; color: #e8e9eb; }
  .role i { font-style: normal; color: #d69e2e; padding: 0 10px; }
  .line { position: absolute; left: 80px; font: 400 26px/1.4 'DM Sans', sans-serif; color: #a0a5ad; max-width: 620px; }
  canvas { position: absolute; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, transparent 30%, #d69e2e 100%); opacity: .75; }
  /* Option A: name, role and line on the left, ASCII portrait on the right */
  .a h1 { top: 140px; font-size: 128px; }
  .a .role { top: 400px; }
  .a .line { top: 460px; }
  .a canvas { right: 36px; top: 40px; }
  /* Option B: type only, the name as the whole picture */
  .b h1 { top: 150px; font-size: 168px; }
  .b .role { top: 470px; }
  .b .line { top: 520px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="mark">myekini<b>@</b>lagos</div>
  <h1>Muhammad<br>Yekini<span>.</span></h1>
  <div class="role">Data Engineer<i>·</i>Cloud FinOps</div>
  <div class="line">Payment and cloud-cost data that adds up.</div>
  <canvas id="portrait" width="900" height="1140" style="width:450px;height:570px"></canvas>
  <div class="rule"></div>
</div>
<script>
  const option = new URLSearchParams(location.search).get('v') || 'a';
  document.getElementById('card').classList.add(option);
  const canvas = document.getElementById('portrait');
  if (option !== 'a') canvas.remove();
  else {
    // Same material as the site portrait: luminance ramp, warm ink, contrast stretched over the subject
    const RAMP = ' .,:;-=+*#%@';
    const img = new Image();
    img.src = '/site/assets/portrait-ascii.webp';
    img.onload = () => document.fonts.ready.then(() => {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, cols = 132, cw = W / cols, ch = cw / 0.6, rows = Math.floor(H / ch);
      const s = document.createElement('canvas'); s.width = cols; s.height = rows;
      const sx = s.getContext('2d', { willReadFrequently: true });
      const scale = Math.min(cols / img.width, rows / (img.height * 0.6 / 1));
      const iw = cols, ih = img.height * (cols / img.width) * 0.6;
      sx.drawImage(img, 0, rows - ih, iw, ih);
      const d = sx.getImageData(0, 0, cols, rows).data;
      const lum = [], alpha = [];
      for (let i = 0; i < cols * rows; i++) { alpha[i] = d[i * 4 + 3] / 255; lum[i] = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]) / 255; }
      const vals = lum.filter((_, i) => alpha[i] > 0.5).sort((a, b) => a - b);
      const lo = vals[Math.floor(vals.length * 0.04)] || 0, hi = vals[Math.floor(vals.length * 0.97)] || 1;
      ctx.font = (cw / 0.6).toFixed(2) + 'px "JetBrains Mono", monospace';
      ctx.textBaseline = 'top';
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (alpha[i] < 0.4) continue;
        let v = Math.min(1, Math.max(0, (lum[i] - lo) / (hi - lo)));
        // Light sharpening against the 3x3 neighbourhood, as on the site
        let n = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const j = (y + dy) * cols + (x + dx);
          if ((dx || dy) && x + dx >= 0 && x + dx < cols && y + dy >= 0 && y + dy < rows && alpha[j] > 0.4) { n += (lum[j] - lo) / (hi - lo); c++; }
        }
        if (c) v = Math.min(1, Math.max(0, v + 0.35 * (v - n / c)));
        const k = Math.min(RAMP.length - 1, Math.round(v * (RAMP.length - 1)));
        if (k === 0) continue;
        ctx.fillStyle = 'rgba(232,217,176,' + (0.3 + 0.7 * v) * alpha[i] + ')';
        ctx.fillText(RAMP[k], x * cw, y * ch);
      }
      document.body.dataset.ready = '1';
    });
  }
</script>
</body>
</html>
